<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>MyAlternates Web</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: desktop = fixed left sidebar + top bar + content grid; mobile web = app layout with product chips on top and a bottom tab bar. */
:root{
  --bg:#F5F5F2; --surface:#FFFFFF; --ink:#111827; --muted:#4B5563; --faint:#6B7280; --line:#E5E7EB; --line2:#F3F4F6;
  --gold:#D4AF37; --gold-ink:#7A5F0E; --gold-soft:#FBF5E2; --gold-line:#EBD9A0;
  --dark:#111827; --dark-2:rgba(255,255,255,0.06); --on-dark:#FFFFFF; --on-dark-2:#D1D5DB;
  --up:#15803D; --down:#B91C1C; --amber:#B45309;
  --font:Outfit, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --chart-dark:#1F2430; --bench1:#2B3242; --bench2:#151B28; --surface-2:#F9FAFB; --topbg:rgba(246,245,241,.86); --acct1:#FFFDF6; --acct2:#FBF5E2;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0A0D14; --surface:#131925; --surface-2:#181F2D; --ink:#EEF0F4; --muted:#B3B9C5; --faint:#8E95A3; --line:#273042; --line2:#1B2231;
  --gold-ink:#E8C65A; --gold-soft:rgba(212,175,55,.10); --gold-line:rgba(212,175,55,.34);
  --up:#4ADE80; --down:#F87171; --amber:#FBBF24;
  --chart-dark:#6A7488; --bench1:#5A6378; --bench2:#3E4658; --topbg:rgba(10,13,20,.82); --acct1:#1C2232; --acct2:#171C29;
  color-scheme:dark;
}
:root[data-theme="dark"] .card{box-shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6)}
:root[data-theme="dark"] .top{border-bottom-color:rgba(255,255,255,.06)}
:root[data-theme="dark"] .otp-info{background:rgba(234,88,12,.10);border-color:rgba(234,88,12,.3)}
:root[data-theme="dark"] .cat{filter:saturate(1.1) brightness(.92)}
:root[data-theme="dark"] input,:root[data-theme="dark"] select{color:var(--ink)}
:root[data-theme="dark"] .avatar{color:var(--ink)}
:root[data-theme="dark"] img[alt="PMS Bazaar"]{background:#fff;border-radius:6px;padding:2px 4px}
:root[data-theme="dark"] .auth-right{background:var(--bg)}
:root[data-theme="dark"] .asof b{color:#F3D57A}
html{transition:background-color .2s}
html,body{height:100%}
/* fluid base size: text and spacing grow/shrink with the window and with browser zoom */
html{font-size:clamp(14px, 0.42vw + 9.5px, 17px)}
body{background:radial-gradient(1200px 500px at 100% -10%, rgba(212,175,55,.10), transparent 60%), var(--bg);background-attachment:fixed;color:var(--ink);font-family:var(--font);font-size:1rem;line-height:1.45}
*{box-sizing:border-box}
a{color:var(--gold-ink);text-decoration:none}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}

/* ---------- app shell ---------- */
.app{display:flex;min-height:100%}
.side{width:clamp(220px, 15vw, 280px);flex-shrink:0;background:linear-gradient(180deg,#0F141F 0%,#151B28 100%);color:#C9CED6;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 14px 16px;gap:3px;overflow-y:auto;scrollbar-width:none}
.side .brand{padding:4px 10px 22px;color:#FFFFFF}
.side .brand svg{width:170px;height:auto;display:block}
.navlabel{font-size:.72rem;font-weight:600;letter-spacing:.9px;text-transform:uppercase;color:var(--faint);padding:16px 12px 6px}
.navitem{display:flex;align-items:center;gap:12px;padding:.62rem .8rem;border-radius:12px;color:#C9CED6;font-weight:500;font-size:.92rem;transition:background .15s,color .15s}
.navitem:hover{background:rgba(255,255,255,.06);color:#fff}
.navitem[aria-current="page"]{background:linear-gradient(90deg,rgba(212,175,55,.22),rgba(212,175,55,.06));color:#F3D77A;font-weight:600;box-shadow:inset 0 0 0 1px rgba(212,175,55,.25)}
.navitem .dot{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:12px;padding:14px 4px 0;border-top:1px solid rgba(255,255,255,.08)}
.powered{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:600;letter-spacing:.6px;color:var(--faint);text-transform:uppercase}
.side .powered{background:var(--surface);border-radius:12px;padding:6px 10px;justify-content:center}
.powered img{width:64px;height:32px}
.signout{display:flex;align-items:center;justify-content:center;gap:8px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-size:.9rem;font-weight:500}
.side .signout{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.12);color:#E5E7EB}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:var(--topbg);backdrop-filter:blur(10px);border-bottom:1px solid rgba(17,24,39,.05);display:flex;align-items:center;gap:12px;padding-block:14px;padding-left:max(28px, env(safe-area-inset-left, 0px));padding-right:max(28px, env(safe-area-inset-right, 0px))}
.top .titles{flex:1;min-width:0}
.top h1{font-size:clamp(1.25rem, 1vw + .8rem, 1.75rem);font-weight:600;letter-spacing:-.2px}
.crumb{font-size:.85rem;color:var(--faint);margin-top:2px}
.crumb a{color:var(--faint)}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--ink);flex-shrink:0}
.acct{position:relative}
.acctbtn{display:flex;align-items:center;gap:12px;height:54px;padding:0 10px 0 7px;border:1px solid var(--gold-line);border-radius:16px;background:linear-gradient(180deg,var(--acct1),var(--acct2));color:var(--ink);font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 1px 2px rgba(122,95,14,.08),0 8px 20px -12px rgba(122,95,14,.35);transition:border-color .15s,box-shadow .15s}
.acctbtn:hover,.acctbtn[aria-expanded="true"]{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.18),0 10px 24px -12px rgba(122,95,14,.45)}
.acctbtn .avatar{width:40px;height:40px;font-size:13px;background:linear-gradient(135deg,#151B28,#2A3142);color:#F3D57A;box-shadow:0 0 0 2px #fff,0 0 0 3px var(--gold-line)}
.acct-name{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15;white-space:nowrap}
.acct-name small{font-size:10.5px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--gold-ink);margin-bottom:2px}
.acct-chev{width:28px;height:28px;border-radius:9px;background:#151B28;color:#F3D57A;display:flex;align-items:center;justify-content:center;transition:transform .2s}
.acctbtn[aria-expanded="true"] .acct-chev{transform:rotate(180deg)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--dark);color:var(--gold);font-weight:600;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.menu{position:absolute;right:0;top:62px;width:340px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 40px rgba(17,24,39,.14);padding:8px;z-index:40}
.menu .mhead{font-size:11px;font-weight:600;letter-spacing:.6px;color:var(--faint);padding:8px 10px 4px;text-transform:uppercase}
.menu button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;width:100%;box-sizing:border-box}
.menu button:hover{background:var(--gold-soft)}
.menu .avatar{width:38px;height:38px;font-size:13px}
.menu .mname{font-size:15px;font-weight:600}
.menu .msub{font-size:12.5px;color:var(--faint)}
.menu .sel{margin-left:auto;width:18px;height:18px;border-radius:50%;border:2px solid var(--line)}
.menu .sel.on{border:6px solid var(--gold)}
.content{flex:1;width:100%;max-width:1680px;margin-inline:auto;display:flex;flex-direction:column;gap:clamp(14px, 1.4vw, 26px);padding-block:clamp(12px, 1.2vw, 22px) 48px;padding-left:max(28px, env(safe-area-inset-left, 0px));padding-right:max(28px, env(safe-area-inset-right, 0px))}
.chiprow{display:none}
.bottom{display:none}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:14px;padding:12px 14px;font-size:14px}
.banner b{font-weight:600}
.banner a{margin-left:auto;font-weight:600}

/* ---------- building blocks ---------- */
.grid{display:grid;gap:clamp(14px, 1.4vw, 24px)}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%, 26rem),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%, 19rem),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%, 13rem),1fr))}
.g-main{grid-template-columns:minmax(0,1.75fr) minmax(min(100%, 22rem),1fr);align-items:start}
.card{background:var(--surface);border-radius:20px;padding:clamp(16px, 1.3vw, 24px);display:flex;flex-direction:column;gap:14px;box-shadow:0 1px 2px rgba(17,24,39,.04),0 8px 24px -12px rgba(17,24,39,.10);border:1px solid rgba(17,24,39,.04);min-width:0;transition:transform .18s,box-shadow .18s}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.card-h h2{font-size:1.1rem;font-weight:600}
.card-h .side-note{font-size:12px;color:var(--faint)}
.hero{position:relative;overflow:hidden;background:radial-gradient(600px 300px at 90% -20%, rgba(212,175,55,.30), transparent 60%),radial-gradient(500px 260px at -10% 120%, rgba(96,165,250,.14), transparent 60%),linear-gradient(135deg,#0F141F 0%,#1B2232 100%);color:var(--on-dark);border-radius:26px;padding:clamp(18px, 1.6vw, 30px);display:flex;flex-direction:column;gap:18px;min-width:0;box-shadow:0 20px 40px -20px rgba(17,24,39,.45)}
.hero .ring1,.hero .ring2{position:absolute;border-radius:50%;pointer-events:none}
.hero .ring1{right:-80px;top:-90px;width:260px;height:260px;border:1px solid rgba(212,175,55,.25)}
.hero .ring2{right:-30px;top:-40px;width:150px;height:150px;border:1px solid rgba(212,175,55,.18)}
.hero > *{position:relative}
.hero .lbl{font-size:13px;color:var(--on-dark-2)}
.hero .big{font-size:clamp(2rem, 2.4vw + 1rem, 3.4rem);font-weight:600;letter-spacing:-1px;line-height:1.05}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:8px}
.pill.up{background:rgba(74,222,128,.15);color:#4ADE80}
.pill.down{background:rgba(248,113,113,.15);color:#FCA5A5}
.tag{font-size:11px;color:#E5E7EB;background:rgba(255,255,255,.08);padding:5px 10px;border-radius:20px;white-space:nowrap}
.usd{font-size:11px;border:1px solid rgba(255,255,255,.25);border-radius:4px;padding:1px 5px;margin-left:6px}
.mini{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:14px;min-width:0;backdrop-filter:blur(2px)}
.mini .l{font-size:12px;color:var(--on-dark-2)}
.mini .v{font-size:18px;font-weight:600;margin-top:3px}
.capbar{height:6px;border-radius:3px;background:rgba(255,255,255,.14)}
.capbar > span{display:block;height:6px;border-radius:3px}
.stat{background:var(--surface);border-radius:16px;padding:16px;box-shadow:0 1px 2px rgba(17,24,39,.04),0 8px 24px -14px rgba(17,24,39,.10);border:1px solid rgba(17,24,39,.04);min-width:0}
.stat .v{font-size:1.25rem;font-weight:600}
.stat .l{font-size:12px;color:var(--faint)}
.tile{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.logo{width:72px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;padding:5px;flex-shrink:0}
.logo img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.cat{font-size:11px;font-weight:600;color:var(--gold-ink);background:var(--gold-soft);padding:4px 8px;border-radius:6px;white-space:nowrap}
.up-t{color:var(--up)} .down-t{color:var(--down)} .amber-t{color:var(--amber)}
.muted{color:var(--faint)}
.tabs{display:flex;background:var(--line2);border-radius:12px;padding:4px;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1;border:none;background:transparent;height:38px;padding:0 14px;border-radius:9px;font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tabs.dark{background:var(--line2)}
[data-pane][hidden]{display:none!important}
.prodcard{display:flex;flex-direction:column;gap:12px;color:var(--ink)}
a.card:hover,.prodcard:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(17,24,39,.05),0 18px 36px -18px rgba(17,24,39,.22)}
.qa{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.capgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.qa{grid-template-columns:minmax(0,1fr) !important}.capgrid{grid-template-columns:minmax(0,1fr)}}
.qa button,.qa a{all:unset;cursor:pointer;display:flex;flex-direction:row;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--line2);font-size:.88rem;font-weight:600;color:var(--ink);transition:background .15s}
.qa button:hover,.qa a:hover{background:var(--gold-soft)}
.qa .ic{width:34px;height:34px;border-radius:10px;background:var(--surface);color:var(--gold-ink);display:flex;align-items:center;justify-content:center}
.allocrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 10px;align-items:center;font-size:.9rem}
.allocrow i{width:10px;height:10px;border-radius:50%}
.allocrow .bar{grid-column:2 / 4}
.greet{font-size:.85rem;color:var(--faint)}
.bar{height:6px;border-radius:3px;background:var(--line2)}
.bar > span{display:block;height:6px;border-radius:3px}
.tblwrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{font-size:12px;font-weight:600;color:var(--faint);text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 8px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--gold-soft)}
.r{text-align:right}
.legend{display:flex;flex-direction:column;gap:10px;flex:1;min-width:0}
.legend div{display:flex;align-items:center;gap:8px;font-size:14px}
.legend i{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.legend b{margin-left:auto;font-weight:600}
.donut{width:130px;height:130px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.donut > div{width:82px;height:82px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.split{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.empty{align-items:center;text-align:center;padding:36px 20px}
.empty .ic{width:52px;height:52px;border-radius:16px;background:var(--gold-soft);color:var(--gold-ink);display:flex;align-items:center;justify-content:center}
.btn{height:44px;padding:0 18px;border:none;border-radius:12px;background:var(--gold);color:#151B28;font-size:15px;font-weight:600}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.search{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border:1px solid var(--line);background:var(--surface);border-radius:12px;color:var(--faint);flex:1;min-width:200px}
.search input{border:none;outline:none;flex:1;min-width:0;font:inherit;font-size:14px;background:transparent;color:var(--ink)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;color:var(--muted);display:inline-flex;align-items:center;white-space:nowrap}
.chip.on{background:var(--dark);border-color:var(--dark);color:#fff}
/* PMS - official, neutral styling */
.pf{display:flex;flex-direction:column;gap:clamp(14px, 1.4vw, 24px)}
.pf .card{border-radius:16px;box-shadow:0 1px 2px rgba(17,24,39,.04),0 10px 30px -18px rgba(17,24,39,.18);border:1px solid var(--line)}
.pf .card-h h2{display:flex;align-items:center;gap:10px}
.pf .card-h h2::before{content:"";width:4px;height:16px;border-radius:2px;background:linear-gradient(180deg,#E8C65A,#B8962E)}
.pf .cat{background:var(--gold-soft);color:var(--gold-ink);font-weight:600}
.pf th{color:var(--gold-ink);background:var(--gold-soft);border-bottom:1px solid var(--line)}
.pf .tabs button[aria-selected="true"]{background:#151B28;color:#fff}
.pf .note{background:var(--gold-soft);border-color:#F1E8CF;color:#6B5A26}
.pf .chip{border-color:#E6D9AE;color:var(--gold-ink);background:var(--gold-soft)}
.pf-sum{background:radial-gradient(520px 220px at 95% -30%, rgba(212,175,55,.28), transparent 60%),linear-gradient(135deg,#0F141F 0%,#1B2232 100%) !important;border:1px solid #2A3142 !important;color:#fff}
.pf-sum .pf-k{border-left-color:rgba(255,255,255,.10)}
.pf-sum .pf-k .l{color:#9CA3AF}
.pf-sum .pf-k.main b{color:#F3D57A}
.pf-sum .up-t{color:#4ADE80}
.pf-sum .down-t{color:#F87171}
.pf-sum .pf-foot{border-top-color:rgba(255,255,255,.10);color:#9CA3AF}
.pf-sum .pf-foot b{color:#fff}
.pf .card-h h2{font-size:1rem;font-weight:600}
.pf .cat{background:var(--line2);color:var(--ink);font-weight:500}
.pf .note{color:var(--faint);background:var(--line2);border:1px solid var(--line2)}
.pf .chip{height:30px;font-size:12px}
.pf .tabs{border-radius:10px}
.pf .tabs button{height:34px;font-size:13px}
.pf .donut{width:150px;height:150px}
.pf .donut > div{width:104px;height:104px}
.pf-row{display:grid;gap:clamp(14px, 1.4vw, 24px);grid-template-columns:minmax(0,1.9fr) minmax(min(100%, 21rem),1fr);align-items:stretch}
.pf-3{display:grid;gap:clamp(14px, 1.4vw, 24px);grid-template-columns:repeat(auto-fit,minmax(min(100%, 19rem),1fr));align-items:stretch}
.pfh{position:relative;overflow:hidden;border-radius:22px;padding:clamp(20px, 2vw, 34px);color:#fff;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:clamp(18px, 2.2vw, 40px);align-items:stretch;
  background:radial-gradient(700px 320px at 0% 0%, rgba(212,175,55,.22), transparent 60%),radial-gradient(600px 300px at 100% 120%, rgba(212,175,55,.16), transparent 60%),linear-gradient(135deg,#0B0F17 0%,#161C2A 55%,#1E2536 100%);
  border:1px solid rgba(212,175,55,.35);box-shadow:0 24px 50px -24px rgba(11,15,23,.6),inset 0 1px 0 rgba(255,255,255,.06)}
.pfh::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,transparent,#E8C65A 25%,#F6E3A1 50%,#B8962E 75%,transparent)}
.pfh > *{position:relative}
.pfh-r1,.pfh-r2{position:absolute !important;border-radius:50%;pointer-events:none;border:1px solid rgba(212,175,55,.18)}
.pfh-r1{width:420px;height:420px;right:-140px;top:-220px}.pfh-r2{width:260px;height:260px;right:-60px;top:-130px;border-color:rgba(212,175,55,.12)}
.pfh-main{display:flex;flex-direction:column;gap:14px;min-width:0}
.pfh-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pfh-eyebrow{font-size:11.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:#E8C65A}
.pfh-date{font-size:12px;color:#C9CED8;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);padding:4px 10px;border-radius:999px}

  .chiprow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px;background:var(--surface);border-radius:14px;box-shadow:0 1px 3px rgba(17,24,39,.06)}
  .chiprow a{flex:1 0 auto;height:38px;padding:0 12px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap}
  .chiprow a[aria-current="page"]{background:var(--gold);color:#151B28;font-weight:600}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;padding-top:8px;padding-bottom:calc(10px + env(safe-area-inset-bottom, 0px));padding-left:env(safe-area-inset-left, 0px);padding-right:env(safe-area-inset-right, 0px)}
  .bottom a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted);min-width:64px}
  .bottom a[aria-current="page"]{color:var(--gold-ink);font-weight:600}
  .content{padding-bottom:100px}
  .acctbtn .acct-name{display:none}
  .acctbtn{padding:0 8px 0 6px}
}
@media (max-width:760px){
  .top{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
  .content{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));gap:14px}
  .top h1{font-size:19px}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .grid{gap:14px}
  .hero{padding:20px;border-radius:20px}
  .card{padding:16px}
  .hide-sm{display:none}
  .auth{grid-template-columns:minmax(0,1fr)}
  .auth-brand{display:none}
  .card-powered{display:flex}
  .auth-brand2{display:none}
  .auth-mobile-head p{margin:0;color:#C9CED8;font-size:14px}
  .auth-card2{border:none;box-shadow:none;padding:8px 0 0}
  .auth-mobile-head{display:flex;flex-direction:column;gap:14px;background:linear-gradient(135deg,#000 0%,#0a0a0a 45%,#5a4716 80%,#C9A43A 100%);color:#fff;padding-block:28px 24px;padding-left:max(20px, env(safe-area-inset-left, 0px));padding-right:max(20px, env(safe-area-inset-right, 0px))}
  .auth-mobile-head svg{width:190px;height:auto}
  .auth-mobile-head h1{font-size:26px;font-weight:600}
  .auth-form{align-items:flex-start;padding-block:24px 32px;padding-left:max(20px, env(safe-area-inset-left, 0px));padding-right:max(20px, env(safe-area-inset-right, 0px))}
  .otp{gap:8px}
  .otp input{width:calc((100% - 40px) / 6);height:54px}
  .menu{position:fixed;left:12px;right:12px;width:auto;top:118px}
  /* phone header: row 1 = title + icons, row 2 = full-width account switcher */
  .top{flex-wrap:wrap;row-gap:10px;gap:8px}
  .top .titles{flex:1 1 0;min-width:0}
  .top h1{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .greet{font-size:12px}
  .iconbtn{width:38px;height:38px;border-radius:10px}
  .acct{order:10;flex:1 1 100%}
  .acctbtn{width:100%;height:48px;border-radius:14px}
  .acctbtn .acct-name{display:flex;min-width:0}
  .acct-name > *{max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .acct-chev{margin-left:auto}
  /* hero tiles: tighter, values never squeeze the labels */
  .pfh{padding:18px;border-radius:18px;gap:16px}
  .pfh-val{font-size:2.1rem}
  .pfh-tile{padding:12px;gap:10px}
  .pfh-tile .ic{width:34px;height:34px;border-radius:10px}
  .pfh-tile b{font-size:1.05rem}
  .pfh-tile .l,.pfh-tile.cap .l{font-size:13.5px}
  .pfh-tile .s,.pfh-tile.cap .s{font-size:12px}
  .pfh-day{padding:12px;gap:10px}
  .pfh-day .v{font-size:1.2rem}
  .capring-row{gap:12px;padding:12px}
  /* no sideways scrolling */
  .main,.content{min-width:0;max-width:100vw;overflow-x:clip}
  .content > *{min-width:0;max-width:100%}
  .card-h{gap:8px}
  .fs-dialog{max-height:88vh}
  /* quick actions: three compact tiles in one row */
  .qa{grid-template-columns:repeat(3,minmax(0,1fr)) !important;gap:8px}
  .qa button,.qa a{flex-direction:column;justify-content:center;text-align:center;padding:12px 6px;gap:6px;font-size:12.5px;position:relative}
  .qa-badge{position:absolute;top:6px;right:6px;margin:0;font-size:10px;padding:2px 6px}
  /* donut cards: chart on top, full-width legend so names are not cut */
  .split{flex-direction:column;align-items:stretch;gap:16px}
  .split > .donut{align-self:center}
  .legend{width:100%}
  .legend div{font-size:13.5px}
  /* transaction tables become two-line rows: scheme + amount, date + type */
  .txtbl thead{display:none}
  .txtbl tbody tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;padding:11px 14px;border-bottom:1px solid var(--line2)}
  .txtbl tbody tr[hidden]{display:none}
  .txtbl tbody tr:last-child{border-bottom:none}
  .txtbl td{border:none;padding:0 !important;font-size:13.5px}
  .txtbl td:nth-child(1){grid-column:1;grid-row:1;font-weight:600}
  .txtbl td:nth-child(3){grid-column:1;grid-row:2;font-size:12.5px;color:var(--faint)}
  .txtbl td:nth-child(4){grid-column:2;grid-row:2;justify-self:end;font-size:12.5px}
  .txtbl td:nth-child(5){grid-column:2;grid-row:1;justify-self:end;text-align:right}
  .txtbl tr[data-empty] td{grid-column:1 / -1;text-align:center}
  .tblwrap:has(.txtbl){overflow-x:visible}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const PF = { inv: 'linear-gradient(180deg,#E8C65A,#B8962E)', bench: 'linear-gradient(180deg,var(--bench1),var(--bench2))' };
function perfBars(data, bench = 'Benchmark'){
  const vals = data.flatMap(d => [d[1], d[2]]);
  const step = (() => { const m = Math.max(...vals.map(Math.abs)); return m <= 4 ? 1 : m <= 8 ? 2 : m <= 20 ? 5 : 10; })();
  const hi = Math.ceil(Math.max(0, ...vals) / step) * step || step, lo = Math.floor(Math.min(0, ...vals) / step) * step;
  const span = hi - lo, z = -lo / span * 100, ticks = [];
  for (let t = lo; t <= hi + 1e-9; t += step) ticks.push(t);
  const pos = t => ((t - lo) / span * 100).toFixed(2);
  const bar = (v, c, side) => { const h = Math.abs(v) / span * 100; return `<div class="pc-b${v < 0 ? ' neg' : ''}" style="background:${c};height:${h.toFixed(2)}%;bottom:${(v < 0 ? z - h : z).toFixed(2)}%;${side}:calc(50% + 2px)" title="${pct(v)}"></div>`; };
  return `<div class="pc" style="--ph:clamp(200px, 15vw, 280px);--n:${data.length}" role="img" aria-label="${esc(data.map(d => d[0] + ': portfolio ' + pct(d[1]) + ', benchmark ' + pct(d[2])).join('; '))}">
    <div class="pc-y">${ticks.map(t => `<span style="bottom:${pos(t)}%">${t}%</span>`).join('')}</div>
    <div class="pc-plot">${ticks.map(t => `<div class="pc-grid${t === 0 ? ' zero' : ''}" style="bottom:${pos(t)}%"></div>`).join('')}
      <div class="pc-groups">${data.map(d => { const a = d[1] - d[2]; return `<div class="pc-g" tabindex="0">${bar(d[1], PF.inv, 'right')}${bar(d[2], PF.bench, 'left')}<div class="pc-tip"><b>${d[0]}</b><div><span><i style="background:${PF.inv}"></i>Portfolio</span><b class="num">${pct(d[1])}</b></div><div><span><i style="background:${PF.bench}"></i>${bench}</span><b class="num">${pct(d[2])}</b></div><div class="${a >= 0 ? 'up-t' : 'down-t'}"><span>Alpha</span><b class="num">${a >= 0 ? '+' : '−'}${Math.abs(a).toFixed(2)}</b></div></div></div>`; }).join('')}</div></div>
    <div class="pc-x">${data.map(d => `<div><span class="per">${d[0]}</span></div>`).join('')}</div></div>`;
}
function lineChart(vals, labels, lo, hi, unit){
  const W = 700, H = 230, L = 64, R = 12, T = 12, B = 34, iw = W - L - R, ih = H - T - B;
  const x = i => L + i * iw / (vals.length - 1), y = v => T + (hi - v) / (hi - lo) * ih;
  let out = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="AUM growth">`;
  for (let k = 0; k <= 4; k++){ const v = lo + (hi - lo) * k / 4; out += `<line x1="${L}" y1="${y(v)}" x2="${W - R}" y2="${y(v)}" style="stroke:var(--line)" stroke-dasharray="3 4"/><text x="${L - 8}" y="${y(v) + 4}" font-size="11" text-anchor="end" style="fill:var(--faint)" font-family="Outfit, sans-serif">${unit(v)}</text>`; }
  const pts = vals.map((v, i) => x(i) + ',' + y(v)).join(' ');
  out += `<polygon points="${x(0)},${T + ih} ${pts} ${x(vals.length - 1)},${T + ih}" fill="rgba(212,175,55,0.15)"/>`;
  out += `<polyline points="${pts}" fill="none" stroke="#B8962E" stroke-width="2.5" stroke-linejoin="round"/>`;
  out += `<circle cx="${x(vals.length - 1)}" cy="${y(vals[vals.length - 1])}" r="4.5" fill="#B8962E"/>`;
  labels.forEach((l, i) => { out += `<text x="${x(i)}" y="${H - 10}" font-size="11" text-anchor="middle" style="fill:var(--faint)" font-family="Outfit, sans-serif">${l}</text>`; });
  return out + '</svg>';
}

function fsPdf(lines){
  const esc2 = t => t.replace(/[\\()]/g, m => '\\' + m).replace(/[^\x20-\x7E]/g, '');
  let y = 790, body = 'BT /F1 18 Tf 50 ' + y + ' Td (' + esc2(lines[0]) + ') Tj ET\n';
  lines.slice(1).forEach(l => { y -= 22; body += 'BT /F1 11 Tf 50 ' + y + ' Td (' + esc2(l) + ') Tj ET\n'; });

  let out = '%PDF-1.4\n', offs = [];
  objs.forEach((o, i) => { offs.push(out.length); out += (i + 1) + ' 0 obj\n' + o + '\nendobj\n'; });
  const x = out.length; out += 'xref\n0 ' + (objs.length + 1) + '\n0000000000 65535 f \n' + offs.map(n => String(n).padStart(10, '0') + ' 00000 n \n').join('') + 'trailer\n<< /Size ' + (objs.length + 1) + ' /Root 1 0 R >>\nstartxref\n' + x + '\n%%EOF';

  const viaAnchor = () => { try { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); toast('Downloading factsheet · ' + f.month); } catch (e) { toast('Download is not available here'); } };

function dhChart(vals, labels, lo, hi, fmt){

  const pts = vals.map((v, i) => [X(i), Y(v)]);
  let d = 'M' + pts[0][0] + ' ' + pts[0][1];
  for (let i = 1; i < pts.length; i++){ const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], cx = (x0 + x1) / 2; d += ` C ${cx} ${y0}, ${cx} ${y1}, ${x1} ${y1}`; }

  return `<div class="bd-chartwrap"><svg viewBox="0 0 ${W} ${H}" class="bd-chart" role="img" aria-label="AUM growth">
    ${ticks.map(t => `<line x1="${pl}" x2="${W - pr}" y1="${Y(t)}" y2="${Y(t)}" class="g"/><text x="${pl - 8}" y="${Y(t) + 4}" text-anchor="end" class="t">${fmt(t)}</text>`).join('')}
    ${labels.map((l, i) => `<line x1="${X(i)}" x2="${X(i)}" y1="${pt}" y2="${H - pb}" class="g" style="opacity:.5"/><text x="${X(i)}" y="${H - 10}" text-anchor="middle" class="t">${l}</text>`).join('')}
    <path d="${d} L ${X(vals.length - 1)} ${H - pb} L ${pl} ${H - pb} Z" class="a"/><path d="${d}" class="l"/>
    ${pts.map((q, i) => `<circle cx="${q[0]}" cy="${q[1]}" r="${i === pts.length - 1 ? 5 : 3.5}" class="d"><title>${labels[i]}: ${fmt(vals[i])}</title></circle>`).join('')}</svg></div>`;
}

function themeSwitch(){ const d = getTheme() === 'dark'; return `<div class="theme-seg" role="radiogroup" aria-label="Theme"><button type="button" role="radio" aria-checked="${!d}" onclick="setTheme('light')">${svg('sun', 16, 2)}Light</button><button type="button" role="radio" aria-checked="${d}" onclick="setTheme('dark')">${svg('moon', 16, 2)}Dark</button></div>`; }

  const P = PROFILE, row = (ic, l, v) => `<div class="prow"><span class="pic">${svg(ic, 18, 1.9)}</span><div><div class="plabel">${l}</div><div class="pval">${v}</div></div></div>`;
  const kv = (l, v) => `<div class="pkv"><span>${l}</span><b>${v}</b></div>`;
  return `<div class="pf">

  </div>
  ${hasFamily() ? `<section class="card pf-card"><div class="card-h"><h2>Linked family members</h2></div><div class="fam-links">${famMembers().filter(m => m.id !== 'self').map(m => `<div class="fam-link"><span class="avatar" style="background:var(--line2)">${m.ini}</span><div><b>${m.name}</b><div class="muted" style="font-size:13px">${m.rel} · ${m.products}</div></div></div>`).join('')}</div></section>` : ''}
</div>`;
};
function render(){
  let r = route();
  if (r === 'signout'){ signOut(); return; }
  if (!S.role && r === 'setmpin' && !S.otpOk) r = 'login';
  if (!S.role && r !== 'login' && r !== 'otp' && r !== 'setmpin'){ location.replace('#login'); r = 'login'; }
  if (S.role === 'investor' && DIST_ROUTES.includes(r)) r = 'home';
  if (S.role === 'investor' && !S.viewingAs){
    if (!hasFamily() && S.account === 'family') S.account = 'self';
    if (MEM_PRODUCTS[S.account] && !famMembers().some(m => m.id === S.account)) S.account = 'self';
    if (r === 'family' && !hasFamily()) r = 'home';
    if (singleMode() && (r === 'home' || r === 'family')){ r = ROUTE_OF[heldKeys()[0]]; location.replace('#' + r); }
    if (PCOL[r] && !visHeld(r)){ r = singleMode() ? ROUTE_OF[heldKeys()[0]] : 'home'; location.replace('#' + r); }
  }
  if (S.role === 'distributor' && !S.viewingAs && INV_ROUTES.includes(r)) r = 'd-home';
  if (S.role && (r === 'login' || r === 'otp' || r === 'setmpin')) { r = S.role === 'distributor' ? 'd-home' : 'home'; location.replace('#' + r); }
  if (r === 'login'){ const useMpin = hasPin(S.loginRole) && !S.useOtp && !S.resetting; root.innerHTML = useMpin ? mpinView() : loginView(); if (useMpin) setTimeout(() => document.getElementById('pin-0')?.focus(), 50); }
  else if (r === 'setmpin'){ root.innerHTML = setMpinView(); setTimeout(() => document.getElementById('pin-0')?.focus(), 50); }
  else if (r === 'otp') { root.innerHTML = otpView(); setTimeout(() => document.getElementById('otp-0')?.focus(), 50); }
  else { if (r !== 'd-earnings') brkSetUnlocked(false); root.innerHTML = shell(r, (V[r] || V.home)()); }
  window.scrollTo(0, 0);
}
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 3200); }
function signOut(){ brkSetUnlocked(false); S.role = null; S.viewingAs = null; S.account = 'self'; S.useOtp = false; S.resetting = false; S.otpOk = null; location.replace('#login'); render(); }

document.addEventListener('click', e => {
  const t = e.target;
  const roleBtn = t.closest('[data-role]'); if (roleBtn && !INTERNAL){ S.loginRole = roleBtn.dataset.role; S.useOtp = false; S.resetting = false; render(); return; }
  if (t.closest('[data-forgot]')){ S.resetting = true; S.useOtp = true; render(); toast('Verify with OTP to reset your MPIN.'); return; }
  if (t.closest('[data-otp-login]')){ S.useOtp = true; render(); return; }
  if (t.closest('[data-use-mpin]')){ S.useOtp = false; S.resetting = false; render(); return; }
  if (t.closest('[data-reset-demo]')){ delete PINS.investor; delete PINS.distributor; savePins(); S.useOtp = false; S.resetting = false; render(); toast('Demo reset. Sign in with OTP and set a new MPIN.'); return; }
  const m = t.closest('[data-method]'); if (m){ S.method = m.dataset.method; render(); return; }
  const tab = t.closest('[data-tab]');
  if (tab){ const g = tab.closest('[data-tabgroup]'); if (g){ const own = el => el.closest('[data-tabgroup]') === g;
    g.querySelectorAll('[data-tab]').forEach(b => { if (own(b)) b.setAttribute('aria-selected', b === tab); });
    g.querySelectorAll('[data-pane]').forEach(p => { if (own(p)) p.hidden = p.dataset.pane !== tab.dataset.tab; }); } return; }
  const row = t.closest('[data-go]'); if (row){ if (row.dataset.idx) S.idx = +row.dataset.idx; go(row.dataset.go); return; }
  const vi = t.closest('[data-view-investor]'); if (vi){ S.viewingAs = vi.dataset.viewInvestor; S.account = 'self'; go('home'); return; }
  if (t.closest('[data-exit-view]')){ S.viewingAs = null; return; }
  if (t.closest('[data-signout]')){ e.preventDefault(); signOut(); return; }
  const tb = t.closest('[data-toast]'); if (tb){ toast(tb.dataset.toast); return; }
  const ab = t.closest('#acctBtn'); const menu = document.getElementById('acctMenu');
  if (ab && menu){ menu.hidden = !menu.hidden; ab.setAttribute('aria-expanded', !menu.hidden); return; }
  const mem = t.closest('[data-member]');
  if (mem){ const id = mem.dataset.member; S.account = id; if (id === 'family') go('family'); else go('home'); return; }
  if (menu && !menu.hidden && !t.closest('.acct')){ menu.hidden = true; document.getElementById('acctBtn')?.setAttribute('aria-expanded', 'false'); }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'loginForm'){
    const v = (document.getElementById('login-in')?.value || '').trim();
    if (S.method === 'mobile'){ const d = v.replace(/\D/g, ''); S.dest = '+91 ' + (d.length === 10 ? d.slice(0, 5) + ' ' + d.slice(5) : d || '98765 43210'); }
    else if (S.method === 'email') S.dest = v || 'your email address';
    else S.dest = 'your registered mobile and email';
    go('otp');
  }
  if (e.target.id === 'otpForm') checkOtp();
  if (e.target.id === 'pinForm' || e.target.id === 'setPinForm') checkPin();
});
function checkOtp(){
  const code = [0, 1, 2, 3, 4, 5].map(i => document.getElementById('otp-' + i).value).join('');
  const err = document.getElementById('otpErr');
  if (code.length < 6){ err.textContent = 'Enter all 6 digits.'; return; }
  if (code !== '123456'){ err.textContent = 'Incorrect OTP. In this demo the OTP is 123456.'; const b = document.getElementById('otpBoxes'); b.style.animation = 'none'; void b.offsetWidth; b.style.animation = 'shake .35s'; [0, 1, 2, 3, 4, 5].forEach(i => { document.getElementById('otp-' + i).value = ''; }); document.getElementById('otp-0').focus(); return; }
  S.otpOk = S.loginRole;
  if (!hasPin(S.loginRole) || S.resetting){ S.pinStep = 1; S.pin1 = ''; go('setmpin'); return; }
  finishLogin();
}
function finishLogin(){
  S.role = S.loginRole; S.viewingAs = null; S.account = 'self'; S.useOtp = false; S.resetting = false; S.otpOk = null;
  go(S.role === 'distributor' ? 'd-home' : 'home');
}
function pinError(msg){
  const err = document.getElementById('pinErr'); if (err) err.textContent = msg;
  const b = document.getElementById('pinBoxes'); if (b){ b.style.animation = 'none'; void b.offsetWidth; b.style.animation = 'shake .35s'; }
  [0, 1, 2, 3].forEach(i => { const el = document.getElementById('pin-' + i); if (el) el.value = ''; });
  document.getElementById('pin-0')?.focus();
}
function checkPin(){
  const code = [0, 1, 2, 3].map(i => document.getElementById('pin-' + i)?.value || '').join('');
  if (code.length < 4){ document.getElementById('pinErr').textContent = 'Enter all 4 digits.'; return; }
  if (route() === 'setmpin'){
    if (S.pinStep === 1){
      if (/^(\d)\1{3}$/.test(code) || '0123456789'.includes(code) || '9876543210'.includes(code)) return pinError('Choose a less predictable MPIN (no 1111 or 1234).');
      S.pin1 = code; S.pinStep = 2; render(); return;
    }
    if (code !== S.pin1){ S.pinStep = 1; S.pin1 = ''; render(); setTimeout(() => { document.getElementById('pinErr').textContent = 'MPINs did not match. Please set it again.'; }, 0); return; }
    const wasReset = S.resetting; PINS[S.loginRole] = code; savePins(); finishLogin();
    toast(wasReset ? 'MPIN reset. Use your new MPIN next time.' : 'MPIN set. Use it to sign in next time.');
    return;
  }
  if (code !== PINS[S.loginRole]){ S.pinTries = (S.pinTries || 0) + 1;
    if (S.pinTries >= 5){ S.pinTries = 0; S.resetting = true; S.useOtp = true; render(); toast('Too many wrong attempts. Reset your MPIN with OTP.'); return; }
    return pinError(`Incorrect MPIN. ${5 - S.pinTries} attempt${5 - S.pinTries === 1 ? '' : 's'} left.`); }
  S.pinTries = 0; finishLogin();
}
document.addEventListener('input', e => {
  const pm = /^pin-(\d)$/.exec(e.target.id || '');
  if (pm){ const i = +pm[1], v = e.target.value.replace(/\D/g, ''); e.target.value = v.slice(-1);
    if (v){ document.getElementById('pin-' + Math.min(3, i + 1))?.focus(); }
    if ([0, 1, 2, 3].every(k => document.getElementById('pin-' + k).value)) checkPin();
    return; }
  const m = /^otp-(\d)$/.exec(e.target.id || ''); if (!m) return;
  const i = +m[1], v = e.target.value.replace(/\D/g, '');
  if (v.length > 1){ v.slice(0, 6 - i).split('').forEach((c, k) => { const el = document.getElementById('otp-' + (i + k)); if (el) el.value = c; }); }
  else e.target.value = v;
  const next = document.getElementById('otp-' + Math.min(5, i + Math.max(1, v.length)));
  if (v && next) next.focus();
  if ([0, 1, 2, 3, 4, 5].every(k => document.getElementById('otp-' + k).value)) checkOtp();
});
document.addEventListener('keydown', e => {
  const pk = /^pin-(\d)$/.exec(e.target.id || '');
  if (pk && e.key === 'Backspace' && !e.target.value && +pk[1] > 0) document.getElementById('pin-' + (+pk[1] - 1)).focus();
  const m = /^otp-(\d)$/.exec(e.target.id || '');
  if (m && e.key === 'Backspace' && !e.target.value && +m[1] > 0) document.getElementById('otp-' + (+m[1] - 1)).focus();
  if (e.key === 'Escape'){ const menu = document.getElementById('acctMenu'); if (menu) menu.hidden = true; }
});
render();
</script>
